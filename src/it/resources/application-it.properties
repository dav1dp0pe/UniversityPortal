# Testcontainers manages the Postgres container automatically
spring.datasource.url=jdbc:tc:postgresql:16:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# Testcontainers default credentials — must be explicit to override application.properties
spring.datasource.username=test
spring.datasource.password=test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root = info
logging.level.org.springframework = info
logging.level.org.springframework.test = info
logging.level.org.springframework.jdbc = info
logging.level.com.zaxxer.hikari = info

#When needing sql debugging
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
